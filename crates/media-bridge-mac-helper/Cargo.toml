[package]
name = "media-bridge-mac-helper"
description = "macOS 专用：被 /usr/bin/perl 加载后读取 MediaRemote 的 now-playing（macOS 15.4+ 只有「被授权」的进程能读，见 lib.rs 的说明）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "media_bridge_mac_helper"
path = "src/lib.rs"
# cdylib：被 /usr/bin/perl 用 DynaLoader 加载的产物（build.rs 嵌入主二进制）；
# rlib：让宿主 crate 能把它声明为 build-dependency —— cargo 据此保证 helper
# 先于主 crate 的 build.rs 构建，cdylib 会出现在 target/<profile>/deps/。
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true

# block ABI：与主 crate 的 macOS 实现同一套依赖（Objective-C 运行时 + block）。
# 只在 macOS 上编（本 crate 在别的平台上整体是空的，见 lib.rs 的 crate 级 cfg）。
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
