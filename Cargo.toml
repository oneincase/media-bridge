[workspace]
members = ["crates/media-bridge", "crates/media-bridge-mac-helper"]
# 裸 cargo build / cargo test 只动主 crate；helper 由 build.rs 需要时显式构建
default-members = ["crates/media-bridge"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["oneincase"]
repository = "https://github.com/oneincase/media-bridge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "io-util",
  "io-std",
  "net",
  "signal",
] }
anyhow = "1"
thiserror = "2"
base64 = "0.23"
rustfft = "6"
dirs = "7"

[profile.release]
# cdylib 不能 strip：strip 之后的 Mach-O 在 macOS 27 的 dyld 上会报
# 「mis-aligned LINKEDIT string pool」而被拒绝加载（helper 就是被 perl dlopen 的 cdylib）。
# 只对这一个包关掉；主二进制的 strip 保持不变。
opt-level = 3
lto = "thin"
strip = true

[profile.release.package.media-bridge-mac-helper]
strip = false
